# yaml-language-server: $schema=./project.schema.json
# Project contract for the Hyperion kit repository (dogfood / CI).
# Adopters: do NOT copy this file — use project.example.yml or /setup|/migrate.

version: 1

name: Hyperion
locale: en

layout: single

apps:
  api:
    root: scripts
    manifest: package.json
    source_dirs:
      - scripts

docs:
  requirements: null
  blueprints: .github/docs
  diagrams: null

outputs:
  audits: .github/audits/results
  cards: .github/plans/cards
  implementations: .github/plans/implementations
  diagrams: .github/diagrams

stack_hints: []

conventions:
  requirement_prefixes:
    - REQ
    - BIZ
  finding_prefixes:
    product-owner: PO
    application-security: SEC
    devops: OPS
    code-review: DEV
    ux-design: UX
    architecture: ARCH

management:
  backend: github

audits:
  overlay: null

ci:
  provider: github-actions
  policy: detect
  stack: auto
  hyperion:
    cards_sync: true
    kit_validation: true
    security_scan: true
    product_ci: auto

commands:
  test: npm test
  audit: npm audit --audit-level=moderate

memory:
  auto_capture: true
  decisions_file: .github/memory/DECISIONS.md
