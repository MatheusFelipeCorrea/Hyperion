name: Hyperion — Security Scan

# npm/pip dependency audit + secret scan (trufflehog, verified-only).
# Weekly by default (a full-history trufflehog scan is heavier than a
# per-PR one) plus a lighter pull_request pass; workflow_dispatch for
# an on-demand run.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main, dev, qa]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Audit Node dependencies
        if: hashFiles('package-lock.json') != '' || hashFiles('package.json') != ''
        env:
          HYPERION_AUDIT_SOFT: ${{ vars.HYPERION_AUDIT_SOFT }}
        run: |
          set -e
          if [ "${HYPERION_AUDIT_SOFT}" = "1" ]; then
            npm audit --audit-level=high || true
          else
            npm audit --audit-level=high
          fi

      - name: Audit Python dependencies
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        env:
          HYPERION_AUDIT_SOFT: ${{ vars.HYPERION_AUDIT_SOFT }}
        run: |
          set -e
          pip install pip-audit
          if [ "${HYPERION_AUDIT_SOFT}" = "1" ]; then
            pip-audit -r requirements.txt 2>/dev/null || pip-audit || true
          else
            pip-audit -r requirements.txt 2>/dev/null || pip-audit
          fi

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          extra_args: --only-verified
