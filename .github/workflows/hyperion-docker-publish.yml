name: Hyperion — Docker Publish

# Builds the hyperion-cli image (see Dockerfile) and pushes it to GHCR.
# Triggered by a version tag (v*) so a release always ships a matching
# image, plus workflow_dispatch for a manual rebuild/republish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: manual-<short-sha>)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (CycloneDX)
        # `npm run` prints a banner to stdout that would corrupt the JSON —
        # call npm sbom directly (same command as `npm run hyperion:sbom`).
        run: npm sbom --sbom-format cyclonedx > hyperion-sbom.cdx.json

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperion-sbom
          path: hyperion-sbom.cdx.json

      - name: Attach SBOM to the GitHub Release (tag pushes only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" hyperion-sbom.cdx.json --clobber
          else
            echo "No GitHub Release exists yet for ${GITHUB_REF_NAME} — SBOM is still on the workflow run as a build artifact."
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE="${IMAGE,,}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then TAG="manual-$(echo "${GITHUB_SHA}" | cut -c1-7)"; fi
            echo "tags=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local only — not pushed until it passes the smoke test below)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Smoke-test the image before publishing
        # cli.mjs (the ENTRYPOINT) only reads scripts/ from whatever's
        # mounted at /workspace — same as a real user's `docker run -v
        # $(pwd):/workspace`. This is exactly the check that would have
        # caught cli.mjs missing real commands (COMMANDS drifting out of
        # sync with package.json) before a broken image got published —
        # exercises every command that was missing before that fix, not
        # just one, so a future regression on any of them fails the build.
        run: |
          set -e
          IMAGE_TAG=$(echo "${{ steps.tags.outputs.tags }}" | cut -d, -f1)
          echo "Smoke-testing $IMAGE_TAG"
          docker run --rm -v "$PWD:/workspace" "$IMAGE_TAG" help
          docker run --rm -v "$PWD:/workspace" "$IMAGE_TAG" distribution-purity-check
          for cmd in docs-prose-check llm-eval spec-review-verify audit-verify plan-verify release-verify install-shims; do
            echo "  -- $cmd --help"
            docker run --rm -v "$PWD:/workspace" "$IMAGE_TAG" "$cmd" --help
          done

      - name: Push image (smoke test passed)
        run: |
          set -e
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.tags }}"
          for t in "${TAGS[@]}"; do
            echo "Pushing $t"
            docker push "$t"
          done
