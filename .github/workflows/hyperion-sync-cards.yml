name: Hyperion — Sync Cards

# Pull → verify → push cards on push to main (production sync), or a
# manual forward/reverse-only run via workflow_dispatch. See
# scripts/cards-sync/ci-sync.mjs for the actual pull-verify-push logic.
#
# This repo's own copy is workflow_dispatch-only, unlike the adopter
# template (scripts/hyperion/templates/workflows/hyperion-sync-cards.yml),
# which keeps the push trigger. Hyperion's own repo is the kit itself, not
# a real product — it was never meant to bind its cards to a real GitHub
# Project board, so there's no projectNumber configured on purpose, and a
# push-triggered run would just fail CI's projectNumber check forever.
# Adopters installing the kit into an actual product DO want the push
# trigger, so it stays in the template.
#
# hyperion:no-auto-refresh — this marker tells auditSyncCardsWorkflow
# (scripts/hyperion/pipeline-lib.mjs) to treat this file as intentionally
# customized rather than "outdated". Without it, hyperion:doctor's own
# suggested fix (pipeline-apply --refresh-sync --yes) would silently
# overwrite this file back to the generic template — reintroducing the
# push trigger PR #69 removed on purpose.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without persisting changes"
        required: false
        default: "false"
      sync_direction:
        description: "pull-forward | forward-only | reverse"
        required: false
        default: "pull-forward"

concurrency:
  group: hyperion-sync-cards-${{ github.workflow }}-${{ github.ref }}
  # false, unlike the kit's other workflows: ci-sync.mjs performs multiple
  # non-transactional writes (labels, issues, ProjectV2 fields). Cancelling
  # an in-flight run mid-write can leave the board partially synced with no
  # rollback, so a second trigger queues instead of cutting the first one off.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # repository-projects governs classic Projects, not ProjectV2 — the actual
  # write access ci-sync.mjs needs comes from secrets.PROJECT_SYNC_TOKEN
  # (see scripts/cards-sync/sync.mjs). Kept for GITHUB_TOKEN fallback paths.
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pull → verify → push (main CI)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sync_direction != 'reverse' && github.event.inputs.sync_direction != 'forward-only')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          CREATE_MISSING_LABELS: "true"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CARDS_CI_REQUIRE_PROJECT: "true"
          CARDS_CI_STRICT_GIT: "true"
        run: node scripts/cards-sync/ci-sync.mjs

      - name: Forward sync only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sync_direction == 'forward-only'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATE_MISSING_LABELS: "true"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CARDS_CI_SKIP_REVERSE: "true"
          CARDS_CI_SKIP_BOARD_GUARD: "true"
        run: node scripts/cards-sync/ci-sync.mjs

      - name: Reverse sync only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sync_direction == 'reverse'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/cards-sync/sync.mjs --reverse
