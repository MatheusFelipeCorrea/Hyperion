name: Hyperion — Kit Validation

# Runs Hyperion maintainer checks. Enable via project.yml → ci.hyperion.kit_validation: true
# Safe to add alongside existing product CI — does not replace lint/test/build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  hyperion-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate project.yml against schema
        run: npm run hyperion:project-verify

      - name: Docs link check
        run: npm run docs:check

      - name: Docs prose drift check
        run: npm run docs:prose-check

      - name: Validate skills
        run: npm run skills:validate

      - name: Runtime rules in sync
        run: npm run hyperion:check-rules

      - name: Validate cards (frontmatter + hierarchy)
        run: node scripts/cards-sync/validate.mjs

      - name: Skills structural eval
        run: npm run hyperion:skills-eval

      - name: LLM eval fixtures
        run: npm run hyperion:llm-eval

      - name: Skills catalog in sync
        run: npm run hyperion:skills-catalog -- --check

      - name: Unit tests (hyperion + cards)
        run: npm test

      - name: Sync cards (dry-run)
        run: node scripts/cards-sync/sync.mjs --dry-run
