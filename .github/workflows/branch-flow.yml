name: Branch flow

# Kit-only: long-lived branches move one step at a time (dev → qa → main → internal).
# Make "branch-flow" a required check on qa, main and internal.

on:
  pull_request:
    branches: [qa, main, internal]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  branch-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/kit
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: PR comes from the right branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: node scripts/kit/branch-flow.mjs
