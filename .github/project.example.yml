# yaml-language-server: $schema=./project.schema.json
# Project contract for .github/ agents and skills.
#
# Adopter template — copy this file to project.yml (do NOT copy the kit's
# dogfood project.yml). Prefer /setup or /migrate for a guided wire-up.
# Do not blindly copy kit workflows; use /pipeline when you want CI.
#
# Paths are POSIX-style, relative to repo root.

version: 1

# Where the kit folder lives relative to the PRODUCT repo root.
# Preferred adoption: copy the whole Hyperion folder into the product, then:
#   npm run hyperion:init -- --adopt
# Upstream Hyperion repo (this kit) omits kit.root — files stay at workspace root.
kit:
  root: Hyperion

name: My Project
locale: en

# Workspace shape: single | monorepo | multi-package
layout: single

# Applications / packages
apps:
  api:
    root: src
    manifest: package.json
    source_dirs:
      - src

# Documentation paths (all optional — discovery fills what it finds)
docs:
  requirements: null
  blueprints: .github/docs
  diagrams: null

# Where agents/skills write new artifacts
outputs:
  audits: .github/audits/results
  cards: .github/plans/cards
  implementations: .github/plans/implementations
  diagrams: .github/diagrams

# Stack hints (optional — discovery confirms via imports/configs)
stack_hints:
  - Node.js
  - Express
  - PostgreSQL

# Conventions
conventions:
  requirement_prefixes:
    - REQ
    - BIZ
  finding_prefixes:
    product-owner: PO
    application-security: SEC
    devops: OPS
    code-review: DEV
    ux-design: UX
    architecture: ARCH

# Project management tool (optional — discovery auto-detects)
management:
  # backend: github | jira | azure-devops | linear | gitlab | none
  backend: github
  # For Jira:
  #   url: https://your-org.atlassian.net
  #   project_key: PROJ
  # For Azure DevOps:
  #   org: https://dev.azure.com/your-org
  #   project: MyProject
  # For Linear:
  #   team: my-team
  # For GitHub (default — auto-detected from git remote):
  #   owner: auto
  #   repo: auto

# Audit overlay (optional — domain-specific context for audit prompts)
audits:
  overlay: null

# CI/CD — Hyperion adds hyperion-*.yml; policy detect never overwrites existing product CI
ci:
  provider: github-actions
  policy: detect
  stack: auto
  hyperion:
    cards_sync: true
    kit_validation: false
    security_scan: true
    product_ci: auto
    # pull-forward (push to main syncs; board drift blocks PRs) | auto (two-way reconcile:
    # board status/sprint are committed back to markdown; needs PROJECT_SYNC_TOKEN)
    cards_sync_mode: pull-forward
  # Quality gates from the /pipeline interview (npm run hyperion:pipeline-gates --yaml for a draft).
  # Modes: off | warn (runs, never fails) | block (fails the pipeline). Renders hyperion-product-ci.yml.
  # Preview cost + diff before applying: npm run hyperion:pipeline-gates -- --preview
  # gates:
  #   preset: balanced         # minimal | balanced | strict — explicit keys below win
  #   declined: [notify]       # interview questions the team refused (not asked again)
  #   branches: [main, dev]
  #   pull_request: true
  #   merge_group: true        # merge queue (default true)
  #   affected: true           # monorepo: PRs run only apps whose files changed
  #   artifacts: true          # coverage/test reports as artifacts (7 days)
  #   defaults:
  #     lint: block
  #     format: { mode: block, fix: suggest }   # styles gate; fix: off | suggest (PR suggestions) | commit
  #     typecheck: block
  #     test: block
  #     build: block
  #     coverage: { mode: warn, metric: lines, min: 80, comment: true, diff: { mode: block, min: 80 } }
  #     audit: { mode: warn, level: high, fix: check }   # fix: off | check (try + revert) | pr (weekly PR)
  #   apps:
  #     api:
  #       path: apps/api
  #       coverage: { mode: block, min: 89 }
  #       migrations: block
  #       services: auto       # postgres/mysql/mariadb/mongo/redis/rabbitmq containers for tests
  #       migrate: true        # detected migrate command before tests
  #       matrix: { versions: [20, 22] }
  #     mobile:
  #       path: apps/mobile
  #       coverage: { ignore: ["lib/screens/**", "*.g.dart"] }
  #   docker: { build: block, scan: warn, lint: warn, cache: true, publish: false }
  #   compose_smoke: { mode: warn, services: [rabbitmq], check: npm run rabbit:check }
  #   e2e: warn
  #   dependency_review: warn
  #   secrets_scan: block
  #   pr_checks: { branch_name: warn, title: warn, card_link: warn, size: 800 }
  #   lighthouse: warn
  #   a11y: warn
  #   bundle_size: warn
  #   mobile_build: { mode: warn, ios: false }
  #   docs: { links: warn, markdown: off }
  #   notify: { on: failure }  # secrets SLACK_WEBHOOK_URL / DISCORD_WEBHOOK_URL
  #   commitlint: off
  #   codeql: off

# Repo-adaptive commands (agents run these — discovery fills when omitted)
commands:
  test: npm test
  lint: null
  build: null
  audit: npm audit --audit-level=moderate

# Session memory (optional)
memory:
  auto_capture: true
  decisions_file: .github/memory/DECISIONS.md

# Local, opt-in usage telemetry for the 6 agent gates (phase/review/audit/
# plan/spec-review/release-verify) — off by default. Never leaves this
# machine: appended to a gitignored .github/plans/telemetry/usage.jsonl.
# Summary: npm run hyperion:telemetry
telemetry:
  enabled: false
