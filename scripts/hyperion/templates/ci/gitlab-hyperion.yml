# Hyperion jobs for GitLab CI — include from .gitlab-ci.yml:
#
#   include:
#     - local: .gitlab/hyperion-ci.yml
#
# Requires Node 20+ and Hyperion scripts (at repo root).
# Cards sync on default branch: pull → verify → push (configure board tokens in CI variables).
# Set CARDS_CI_REQUIRE_PROJECT=true for GitHub Projects V2 when backend is github.

stages:
  - hyperion

.hyperion_node:
  image: node:22
  before_script:
    - node -v

hyperion-validate:
  extends: .hyperion_node
  stage: hyperion
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run docs:check
    - npm run skills:validate
    - npm run hyperion:check-rules
    - npm run hyperion:skills-eval
    - npm test
  allow_failure: false

hyperion-cards:
  extends: .hyperion_node
  stage: hyperion
  resource_group: hyperion-cards-sync
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .github/cards/**/*
        - .github/cards/config/projects-map.json
        - scripts/cards-sync/**
    - when: never
  script:
    - node scripts/cards-sync/ci-sync.mjs

hyperion-cards-pr-guard:
  extends: .hyperion_node
  stage: hyperion
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .github/cards/**/*
        - .github/cards/config/projects-map.json
        - scripts/cards-sync/**
    - when: never
  script:
    - node scripts/cards-sync/pr-board-guard.mjs
  allow_failure: false

hyperion-security:
  extends: .hyperion_node
  stage: hyperion
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      if [ -f package.json ]; then
        npm audit --audit-level=high
      fi
    - |
      if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
        pip install pip-audit
        pip-audit || pip-audit -r requirements.txt
      fi
  allow_failure: false
